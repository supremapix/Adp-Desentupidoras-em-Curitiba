<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>ADP Desentupidora</title>
    <link rel="icon" type="image/webp" href="https://img.supremasite.com.br/adp/logomarca-adp-encanadores-cic-em-curitiba.webp" />
    <link rel="apple-touch-icon" href="https://img.supremasite.com.br/adp/logomarca-adp-encanadores-cic-em-curitiba.webp" />
    <meta name="description" content="Landing page de alta conversão para serviços de desentupidora em Curitiba e Região Metropolitana." />
    
    <meta property="og:title" content="ADP Desentupidora" />
    <meta property="og:description" content="Landing page de alta conversão para serviços de desentupidora em Curitiba e Região Metropolitana." />
    <meta property="og:type" content="website" />
    
    <!-- PWA & Mobile Optimization -->
    <meta name="theme-color" content="#c4161c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Resource Hints para Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.whatsapp.com">
    <link rel="dns-prefetch" href="https://www.youtube.com">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
            // Neutros quentes (substituem o azul-ardósia padrão de template)
            slate: { 50: '#faf8f5', 100: '#f4f1ec', 200: '#e7e2da', 300: '#d6d0c6', 400: '#a8a196', 500: '#78716a', 600: '#57524b', 700: '#433f3a', 800: '#2a2724', 900: '#1c1a17', 950: '#0f0e0c' },
            // Paleta vermelha da logomarca ADP: remapeia todas as classes blue-* do projeto
            blue: { 50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 300: '#fca5a5', 400: '#f87171', 500: '#e5383b', 600: '#d61f26', 700: '#c4161c', 800: '#a11218', 900: '#7f1d1d', 950: '#450a0a' },
              adp: {
                yellow: '#ffc629',
                cream: '#faf6ef',
                navy: '#1c1917',
                blue: '#c4161c',
                blueHover: '#a11218',
                blueLight: '#fef2f2',
                orange: '#b45309',
                orangeHover: '#92400e',
                red: '#b91c1c',
                green: '#15803d',
                greenHover: '#166534',
                surface: '#faf6ef',
                border: '#e7dfd2',
                gray: '#57534e',
                dark: '#1c1917'
              }
            },
            fontFamily: {
              sans: ['Barlow', 'system-ui', '-apple-system', 'sans-serif'],
              display: ['"Barlow Condensed"', 'Barlow', 'system-ui', 'sans-serif'],
              heading: ['"Barlow Condensed"', 'Barlow', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
    
    <style>
      html { 
        scroll-behavior: smooth; 
        -webkit-text-size-adjust: 100%; 
        font-family: 'Barlow', system-ui, -apple-system, sans-serif;
      }
      body { 
        overflow-x: hidden; 
        color: #1c1a17;
        background-color: #ffffff;
      }
      /* Blog Cover & Logo Overlay padrão 16:9 */
      .blog-cover {
        position: relative;
        overflow: hidden;
        border-radius: 1rem;
        aspect-ratio: 16 / 9;
        background-color: #1c1a17;
      }
      .blog-cover img:not(.logo-overlay) {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .logo-overlay { 
        position: absolute; 
        bottom: 20px; 
        right: 20px; 
        width: 60px; 
        height: 60px; 
        background: white; 
        border-radius: 50%; 
        padding: 5px; 
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.15), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        z-index: 10;
        pointer-events: none;
      }
      @media (max-width: 640px) {
        .logo-overlay {
          bottom: 12px;
          right: 12px;
          width: 44px;
          height: 44px;
          padding: 3px;
        }
      }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #a8a196; border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #78716a; }
      h1, h2, h3, .font-display { font-family: 'Barlow Condensed', 'Barlow', system-ui, sans-serif; letter-spacing: -0.005em; }
      body { font-size: 17px; }
      h1, h2 { text-transform: uppercase; line-height: 1; }
      .kicker { display: inline-flex !important; align-items: center; gap: .6rem; font-size: 15px; letter-spacing: 0; text-transform: none; background: none !important; padding: 0 !important; border: 0 !important; }
      .kicker::before { content: ''; display: inline-block; width: 28px; height: 3px; background: #c4161c; flex-shrink: 0; }
      .kicker svg { display: none; }
      .faixa-obra { background: repeating-linear-gradient(-45deg, #1c1a17 0 14px, #ffc629 14px 28px); }
      :focus-visible { outline: 3px solid #ffc629; outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
    </style>
    
    <meta name="google-site-verification" content="lOD8JwSTcclXga5LF3X9UQ8RAjOsNtotuvWunA95VzM" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
