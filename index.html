<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>ADP Desentupidora</title>
    <link rel="icon" type="image/webp" href="https://img.supremasite.com.br/adp/logomarca-adp-encanadores-cic-em-curitiba.webp" />
    <link rel="apple-touch-icon" href="https://img.supremasite.com.br/adp/logomarca-adp-encanadores-cic-em-curitiba.webp" />
    <meta name="description" content="Landing page de alta conversão para serviços de desentupidora em Curitiba e Região Metropolitana." />
    
    <meta property="og:title" content="ADP Desentupidora" />
    <meta property="og:description" content="Landing page de alta conversão para serviços de desentupidora em Curitiba e Região Metropolitana." />
    <meta property="og:type" content="website" />
    
    <!-- PWA & Mobile Optimization -->
    <meta name="theme-color" content="#c4161c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Resource Hints para Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.whatsapp.com">
    <link rel="dns-prefetch" href="https://www.youtube.com">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
            // Paleta vermelha da logomarca ADP: remapeia todas as classes blue-* do projeto
            blue: { 50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 300: '#fca5a5', 400: '#f87171', 500: '#e5383b', 600: '#d61f26', 700: '#c4161c', 800: '#a11218', 900: '#7f1d1d', 950: '#450a0a' },
              adp: {
                navy: '#0f172a',
                blue: '#c4161c',
                blueHover: '#a11218',
                blueLight: '#fef2f2',
                orange: '#b45309',
                orangeHover: '#92400e',
                red: '#b91c1c',
                green: '#15803d',
                greenHover: '#166534',
                surface: '#f8fafc',
                border: '#e2e8f0',
                gray: '#475569',
                dark: '#0f172a'
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
              heading: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            }
          }
        }
      }
    </script>
    
    <style>
      html { 
        scroll-behavior: smooth; 
        -webkit-text-size-adjust: 100%; 
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      body { 
        overflow-x: hidden; 
        color: #1e293b;
        background-color: #ffffff;
      }
      /* Blog Cover & Logo Overlay padrão 16:9 */
      .blog-cover {
        position: relative;
        overflow: hidden;
        border-radius: 1rem;
        aspect-ratio: 16 / 9;
        background-color: #0f172a;
      }
      .blog-cover img:not(.logo-overlay) {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .logo-overlay { 
        position: absolute; 
        bottom: 20px; 
        right: 20px; 
        width: 60px; 
        height: 60px; 
        background: white; 
        border-radius: 50%; 
        padding: 5px; 
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.15), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        z-index: 10;
        pointer-events: none;
      }
      @media (max-width: 640px) {
        .logo-overlay {
          bottom: 12px;
          right: 12px;
          width: 44px;
          height: 44px;
          padding: 3px;
        }
      }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
    
    <meta name="google-site-verification" content="lOD8JwSTcclXga5LF3X9UQ8RAjOsNtotuvWunA95VzM" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
